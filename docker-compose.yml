
services:
  postgres:
    image: postgres:16
    container_name: stockflow-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: stockflow
      POSTGRES_USER: stockflow
      POSTGRES_PASSWORD: stockflow_dev_2026
    ports:
      - "5433:5432"
    volumes:
      - stockflow_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockflow -d stockflow"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  stockflow_data:
